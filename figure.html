<!DOCTYPE html>
<html>
<head>
    <title>HTML Figure and Figcaption</title>
</head>
<body>

    <h1>HTML Figure and Figcaption</h1>

    <figure>
        <img
            src="https://via.placeholder.com/400x250"
            alt="Nature Image"
            width="400"
            height="250">

        <figcaption>
            Figure 1: A sample nature image
        </figcaption>
    </figure>

    <figure>
        <img
            src="https://via.placeholder.com/400x250"
            alt="Technology Image"
            width="400"
            height="250">

        <figcaption>
            Figure 2: A sample technology image
        </figcaption>
    </figure>

</body>
</html>
